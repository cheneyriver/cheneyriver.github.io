<div class="publication-list">
{% for paper in site.data.publications %}
  <article class="publication-entry">
    <div class="entry-label">{{ paper.topic }} <span class="status-label">{{ paper.status }}</span></div>
    <h3>{{ paper.title }}</h3>
    <p class="publication-authors">{{ paper.authors }}</p>
    <p class="publication-venue">{{ paper.venue }}</p>
    {% if paper.links %}
    <ul class="profile-links" aria-label="Publication links">
      {% for link in paper.links %}
      <li><a href="{{ link.url | escape }}">{{ link.label | escape }} <span aria-hidden="true">↗</span></a></li>
      {% endfor %}
    </ul>
    {% endif %}
  </article>
{% endfor %}
</div>
