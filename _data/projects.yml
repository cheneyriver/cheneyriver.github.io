- title: 'Structured Experience Memory for Multi-Agent Collaboration'
  label: 'Agent memory'
  period: 'November 2025 – Present'
  description: 'Exploring how historical experience can be organized into a structured Skill Graph for LLM-based multi-agent systems. The project investigates prerequisite, improvement, and composition relationships among skills that flat memory banks struggle to represent.'
  detail: 'Focus: structured experience reuse, complex task planning, and collaborative decision-making.'
- title: 'Surreality 2.0: Cross-Region MR × AI Art Exhibition'
  label: 'AI in practice'
  period: 'March 2026 – Present'
  description: 'Developing an AI voice guide for a cross-region mixed-reality art exhibition. The interaction pipeline integrates speech recognition, intent understanding, retrieval, and LLM-based response generation.'
  detail: 'Features: exhibition navigation and interactive artwork explanations.'
